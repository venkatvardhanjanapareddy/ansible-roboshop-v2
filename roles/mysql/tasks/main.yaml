- name: enable mysql8.4
  command: dnf module enable mysql:8.4 -y

- name: install mysql
  dnf:
    name: mysql-server
    state: present

- name: enable and start mysqld
  service:
    name: mysqld
    state: started
    enabled: yes

- name: setting root pass
  command: mysql_secure_installation --set-root-pass "{{mysql_root_password}}"
