- name: enable maven3.9
  command: dnf module enable maven:3.9 -y

- name: install java25
  dnf:
    name:
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25
      - java
    state: present

- name: build application
  command: mvn clean package
  args:
    chdir: /app

- name: move jar file
  command: mv target/shipping.jar shipping.jar
  args:
    chdir: /app
