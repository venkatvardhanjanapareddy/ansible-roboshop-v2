- name: copy repo file
  copy:
    src: mongo.repo
    path: /etc/yum.repos.d/mongo.repo

- name: install monogodb-org
  dnf:
    name: mongodb-org
    state: present

- name: start and enable mongodb
  service:
    name: mongod
    state: started
    enabled: yes

- name: allow all servers on 27017
  replace:
    path: /etc/mongod.conf
    regexp: "127.0.0.1"
    replace: "0.0.0.0"

- name: restart mongod
  service:
    name: mongod
    state: restarted
